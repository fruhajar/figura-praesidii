[package]
name = "fp-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "fp"
path = "src/main.rs"

[features]
default = ["http"]
http = ["fp-lookup/http"]

[dependencies]
fp-core = { workspace = true }
fp-correlate = { workspace = true }
fp-lookup = { path = "../fp-lookup", default-features = false }
fp-request = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
