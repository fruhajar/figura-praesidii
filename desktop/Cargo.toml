[workspace]
members = [
    "crates/fp-core",
    "crates/fp-correlate",
    "crates/fp-lookup",
    "crates/fp-request",
    "crates/fp-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
repository = "https://github.com/fruhajar/figura-praesidii"

[workspace.dependencies]
fp-core = { path = "crates/fp-core" }
fp-correlate = { path = "crates/fp-correlate" }
fp-lookup = { path = "crates/fp-lookup" }
fp-request = { path = "crates/fp-request" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
